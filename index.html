<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mi vinilo</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #2f7d5b;
    --ink: #1e293b;
    --muted: #64748b;
    --d: 148px;
    --bg: #191919;
  }
  :root[data-theme="light"] { --bg: #ffffff; }
  @media (max-width: 380px) { :root { --d: 118px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 12px;
    background: var(--bg);
    transition: background-color .4s ease;
  }

  .stage { position: relative; width: 100%; max-width: 440px; padding-top: 72px; }

  /* Botón para alternar el fondo entre negro y blanco */
  .theme-toggle {
    all: unset;
    position: absolute;
    z-index: 6;
    top: 0;
    right: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #fff;
    color: var(--muted);
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(15, 23, 42, .16);
  }
  .theme-toggle:hover { color: var(--ink); }
  .theme-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }
  .theme-toggle .i-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .i-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .i-moon { display: block; }

  /* Pestaña de color: sale desde detrás de la barra blanca al dar play y se esconde al pausar */
  .info {
    position: absolute;
    z-index: 1;
    top: 32px;
    left: calc(var(--d) + 44px);
    right: 26px;
    height: 58px;
    background: var(--accent);
    border-radius: 18px 18px 0 0;
    transform: translateY(44px);
    transition: transform .45s cubic-bezier(.2, .8, .2, 1), background .3s;
  }
  .spinning .info { transform: none; }

  /* Barra blanca con los controles */
  .card {
    position: relative;
    z-index: 2;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 18px 0 calc(var(--d) + 40px);
    background: #fff;
    border-radius: 26px;
    box-shadow: 0 10px 28px rgba(15, 23, 42, .14);
  }

  .btn {
    all: unset;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    color: var(--muted);
    cursor: pointer;
  }
  .btn:hover { color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 28px; height: 28px; fill: currentColor; }
  .play { width: 60px; height: 60px; color: var(--accent); transition: color .4s; }
  .play:hover { color: var(--accent); filter: brightness(.9); }
  .play svg { width: 40px; height: 40px; }
  .play .i-pause, .spinning .play .i-play { display: none; }
  .spinning .play .i-pause { display: block; }

  /* La base blanca donde se apoya el disco (queda vacía mientras se cambia de vinilo) */
  .disc-wrap {
    position: absolute;
    z-index: 3;
    left: 22px;
    top: calc(72px - var(--d) * .38);
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 7px #fff, 0 8px 18px rgba(15, 23, 42, .16);
    cursor: pointer;
  }

  /* Sube y se desvanece al sacar el disco; baja al poner el nuevo */
  .lift {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transition: transform .6s cubic-bezier(.4, 0, .2, 1), opacity .6s;
  }
  .lift.out { transform: translateY(-34px) scale(1.1); opacity: 0; }

  .disc {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    will-change: transform;
  }
  .disc svg { display: block; width: 100%; height: 100%; }
  .sheen {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    background: conic-gradient(from 20deg,
      rgba(255, 255, 255, 0) 0 10%,
      rgba(255, 255, 255, .22) 16%,
      rgba(255, 255, 255, 0) 24% 50%,
      rgba(255, 255, 255, .22) 66%,
      rgba(255, 255, 255, 0) 74%);
  }
  /* Brillo extra sobre los surcos: gira a su propio ritmo, distinto al del disco */
  .sheen2 {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: .8;
    background: conic-gradient(from 0deg,
      rgba(255, 255, 255, 0) 0 40%,
      rgba(255, 255, 255, .3) 48%,
      rgba(255, 255, 255, 0) 56% 100%);
    animation: sheen-spin 4.5s linear infinite;
    animation-play-state: paused;
  }
  .spinning .sheen2 { animation-play-state: running; }
  @keyframes sheen-spin { to { transform: rotate(360deg); } }

  /* Brazo / aguja del tocadiscos */
  .tonearm-mount {
    position: absolute;
    z-index: 4;
    left: calc(22px + var(--d) - 34px);
    top: calc(72px - var(--d) * .38 - 16px);
    width: 96px;
    height: 118px;
    pointer-events: none;
  }
  .tonearm-mount svg { width: 100%; height: 100%; overflow: visible; }
  .arm-rotor {
    transform-box: view-box;
    transform-origin: 78px 16px;
    transform: rotate(-20deg);
    transition: transform .6s cubic-bezier(.3, 0, .2, 1), filter .6s ease;
    filter: drop-shadow(10px 16px 5px rgba(0, 0, 0, .4));
  }
  .spinning .arm-rotor {
    transform: rotate(3deg);
    filter: drop-shadow(1px 2px 1.5px rgba(0, 0, 0, .18));
  }

  /* Partículas sutiles al cambiar de vinilo */
  .dust {
    position: absolute;
    z-index: 5;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--accent) 60%, transparent 75%);
    box-shadow: 0 0 8px var(--accent);
    opacity: 0;
    pointer-events: none;
    animation: dust-float 1.2s ease-out forwards;
  }
  @keyframes dust-float {
    0% { opacity: 0; transform: translate(0, 0) scale(.5); }
    18% { opacity: .95; }
    100% { opacity: 0; transform: translate(var(--dx, 0), -46px) scale(1.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    .lift, .info, .arm-rotor, .dust { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar fondo claro u oscuro">
    <svg class="i-sun" viewBox="0 0 24 24"><path d="M12 4V2M12 22v-2M4 12H2m20 0h-2M5.6 5.6 4.2 4.2m15.6 15.6-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4M12 7a5 5 0 100 10 5 5 0 000-10z"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>

  <div class="info" aria-hidden="true"></div>

  <div class="card">
    <button class="btn" id="prev" aria-label="Vinilo anterior">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>
    </button>
    <button class="btn play" id="play" aria-label="Girar el disco" aria-pressed="false">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="btn" id="next" aria-label="Vinilo siguiente">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg>
    </button>
  </div>

  <div class="disc-wrap" id="disc">
    <div class="lift" id="lift">
      <div class="disc">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="labelTex" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#fff" stop-opacity=".55"/>
              <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
              <stop offset="100%" stop-color="#000" stop-opacity=".38"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="100" fill="#0f1115"/>
          <g fill="none" stroke="#fff" stroke-opacity=".06">
            <circle cx="100" cy="100" r="95"/><circle cx="100" cy="100" r="90"/>
            <circle cx="100" cy="100" r="85"/><circle cx="100" cy="100" r="80"/>
            <circle cx="100" cy="100" r="75"/><circle cx="100" cy="100" r="68"/>
            <circle cx="100" cy="100" r="63"/><circle cx="100" cy="100" r="58"/>
            <circle cx="100" cy="100" r="53"/><circle cx="100" cy="100" r="48"/>
          </g>
          <g fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2">
            <circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="44"/>
          </g>
          <circle cx="100" cy="100" r="36" style="fill: var(--accent)"/>
          <g fill="none" stroke="#000" stroke-opacity=".16" stroke-width=".7">
            <circle cx="100" cy="100" r="30"/><circle cx="100" cy="100" r="24"/><circle cx="100" cy="100" r="18"/>
          </g>
          <circle cx="100" cy="100" r="36" fill="url(#labelTex)"/>
          <path d="M100 64a36 36 0 0 1 0 72z" fill="#fff" fill-opacity=".2"/>
          <circle cx="100" cy="74" r="3.5" fill="#fff"/>
          <circle cx="100" cy="100" r="6" fill="#f1f5f9"/>
        </svg>
        <div class="sheen"></div>
        <div class="sheen2"></div>
      </div>
    </div>
  </div>

  <div class="tonearm-mount" aria-hidden="true">
    <svg viewBox="0 0 96 118">
      <g class="arm-rotor">
        <line x1="78" y1="16" x2="20" y2="40" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
        <path d="M20 40 l-14 4 -2 8 10 4 10 -6z" fill="#94a3b8"/>
        <circle cx="8" cy="49" r="2.2" fill="#0f1115"/>
      </g>
      <circle cx="78" cy="16" r="9" fill="#cbd5e1"/>
      <circle cx="78" cy="16" r="3.5" fill="#94a3b8"/>
    </svg>
  </div>

</div>

<script>
  /* ==========================================================
     AJUSTES
     SWAP_EVERY: segundos que dura cada vinilo girando antes de
                 pasar al siguiente (el tiempo solo corre al girar)
     COLORS:     color de la etiqueta de cada vinilo, en orden.
                 Agrega o quita colores a tu gusto.
     ========================================================== */
  const SWAP_EVERY = 30;
  const COLORS = ["#2f7d5b", "#3b5bdb", "#c2410c", "#7c3aed", "#be185d"];
  /* ========================================================== */

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), play = $("play"), lift = $("lift");
  const root = document.documentElement;
  const themeToggle = $("themeToggle");
  let idx = 0, elapsed = 0, swapping = false;

  /* ---------- Fondo negro / blanco ---------- */
  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("vinylTheme", theme); } catch (e) {}
  }
  let savedTheme = "dark";
  try { savedTheme = localStorage.getItem("vinylTheme") || "dark"; } catch (e) {}
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", () => {
    applyTheme(root.getAttribute("data-theme") === "light" ? "dark" : "light");
  });

  /* ---------- Disco ---------- */
  function showDisc() {
    stage.style.setProperty("--accent", COLORS[idx]);
  }

  function toggle() {
    const on = stage.classList.toggle("spinning");
    play.setAttribute("aria-pressed", on);
    if (on) startCrackle(); else stopCrackle();
  }
  play.addEventListener("click", toggle);
  $("disc").addEventListener("click", toggle);

  /* Cambio de vinilo: sale el disco, la base queda vacía un instante y entra el nuevo */
  function swapTo(n) {
    if (swapping) return;
    swapping = true;
    const wasSpinning = stage.classList.contains("spinning");
    if (wasSpinning) playNeedleLift();
    spawnDust();
    lift.classList.add("out");
    setTimeout(() => {
      idx = (n + COLORS.length) % COLORS.length;
      elapsed = 0;
      showDisc();
      lift.classList.remove("out");
      if (wasSpinning) playNeedleDrop();
      setTimeout(() => { swapping = false; }, 700);
    }, 900);
  }
  function spawnDust() {
    const discEl = $("disc");
    const count = 9;
    for (let i = 0; i < count; i++) {
      const p = document.createElement("span");
      p.className = "dust";
      const angle = Math.random() * Math.PI * 2;
      const radius = 25 + Math.random() * 45;
      p.style.left = (50 + Math.cos(angle) * radius) + "%";
      p.style.top = (50 + Math.sin(angle) * radius) + "%";
      p.style.setProperty("--dx", (Math.random() * 24 - 12) + "px");
      p.style.animationDelay = Math.floor(Math.random() * 150) + "ms";
      discEl.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  }

  $("prev").addEventListener("click", () => swapTo(idx - 1));
  $("next").addEventListener("click", () => swapTo(idx + 1));

  /* Reloj: avanza solo mientras el disco gira; al llegar al final pasa al siguiente */
  setInterval(() => {
    if (!stage.classList.contains("spinning") || swapping) return;
    elapsed += 0.1;
    if (elapsed >= SWAP_EVERY) swapTo(idx + 1);
  }, 100);

  showDisc();

  /* ---------- Sonido de vinilo (sintetizado, sin archivos de audio) ---------- */
  let audioCtx, crackleGain, crackleSource;

  function ensureAudio() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
    crackleGain = audioCtx.createGain();
    crackleGain.gain.value = 0;
    crackleGain.connect(audioCtx.destination);
  }

  function makeCrackleBuffer() {
    const duration = 2;
    const rate = audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, rate * duration, rate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      let sample = (Math.random() * 2 - 1) * 0.035;
      if (Math.random() < 0.0012) sample += (Math.random() * 2 - 1) * 0.55;
      data[i] = sample;
    }
    return buffer;
  }

  function startCrackle() {
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    stopCrackleSource();
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 3200;
    crackleSource = audioCtx.createBufferSource();
    crackleSource.buffer = makeCrackleBuffer();
    crackleSource.loop = true;
    crackleSource.connect(filter).connect(crackleGain);
    crackleSource.start();
    const t = audioCtx.currentTime;
    crackleGain.gain.cancelScheduledValues(t);
    crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
    crackleGain.gain.linearRampToValueAtTime(0.32, t + 0.5);
    playNeedleDrop();
  }

  function stopCrackle() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    crackleGain.gain.cancelScheduledValues(t);
    crackleGain.gain.setValueAtTime(crackleGain.gain.value, t);
    crackleGain.gain.linearRampToValueAtTime(0, t + 0.3);
    playNeedleLift();
    setTimeout(stopCrackleSource, 400);
  }

  function stopCrackleSource() {
    if (crackleSource) {
      try { crackleSource.stop(); } catch (e) {}
      crackleSource.disconnect();
      crackleSource = null;
    }
  }

  function playNeedleDrop() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.25);
  }

  function playNeedleLift() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const size = Math.floor(audioCtx.sampleRate * 0.12);
    const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    src.connect(g).connect(audioCtx.destination);
    src.start(t);
  }
</script>
</body>
</html>
